<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
</head>
<body>
    <div class="player">
        <audio id="audio" controls playsinline preload="auto" controlslist="nodownload noplaybackrate"></audio>
        <span id="status">CONNECTING...</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" style="display:none">
    </div>
    <script src="/static/audio.js?v=3"></script>
</body>
</html>
